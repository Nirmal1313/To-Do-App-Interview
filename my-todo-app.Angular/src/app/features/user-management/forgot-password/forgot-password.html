<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <h1>Forgot Password</h1>
      <p>Enter your email and we will send you a reset link</p>
    </div>

    @if (!sent) {
      <div class="form-field">
        <label for="email">Email</label>
        <input pInputText id="email" type="email" placeholder="Enter your email"
          [(ngModel)]="email" fluid />
      </div>
      <p-button label="Send Reset Link" [fluid]="true" (click)="sendReset()" />
    } @else {
      <div class="sent-box">
        <i class="pi pi-check-circle sent-icon"></i>
        <strong>Check your inbox!</strong>
        <span>We sent a reset link to <em>{{ email }}</em></span>
      </div>
      <p-button label="Send Again" severity="secondary" [fluid]="true"
        (click)="sent = false" />
    }

    <div class="auth-footer">
      <a routerLink="/login">Back to Sign In</a>
    </div>

  </div>
</div>
